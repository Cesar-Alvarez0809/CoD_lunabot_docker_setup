services:
  lunabot:
    build: .
    image: lunabot_ros2:humble
    container_name: lunabot_ros2
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - AUTO_SETUP=true
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./lunabot_ws:/root/lunabot_ws
      - ./ros2_experiments:/root/ros2_experiments
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    command: bash
